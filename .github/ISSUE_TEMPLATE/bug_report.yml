name: Bug report
description: Report a bug in Flowpact
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough detail to reproduce.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, pact snippets, and expected vs actual output.
      render: markdown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flowpact / Python version
      placeholder: "flowpact 0.1.0 · Python 3.12"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: OS, install method, related issue links.
