name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: CLI smoke (example pact)
        run: |
          flowpact validate examples/draft-vs-gold/pact.yaml
          flowpact asks examples/draft-vs-gold/pact.yaml > /tmp/asks.md
          if flowpact no-claim examples/draft-vs-gold/pact.yaml --strict; then
            echo "expected no-claim --strict to fail for blocked claim" >&2
            exit 1
          fi
          flowpact export-eng examples/draft-vs-gold/pact.yaml -o /tmp/export-eng.json
          test -s /tmp/export-eng.json
