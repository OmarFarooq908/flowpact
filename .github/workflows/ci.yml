name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,score]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,score]"
      - name: Pytest
        run: pytest -q
      - name: CLI smoke (example pact)
        run: |
          flowpact validate examples/draft-vs-gold/pact.yaml
          flowpact asks examples/draft-vs-gold/pact.yaml > /tmp/asks.md
          if flowpact no-claim examples/draft-vs-gold/pact.yaml --strict; then
            echo "expected no-claim --strict to fail for blocked claim" >&2
            exit 1
          fi
          flowpact export-eng examples/draft-vs-gold/pact.yaml -o /tmp/export-eng.json
          test -s /tmp/export-eng.json
          # Score run: example includes a hard-gate fail → claim FAIL (exit 1) is OK
          set +e
          flowpact-score run \
            --export-eng /tmp/export-eng.json \
            --gold examples/draft-vs-gold/gold.jsonl \
            --drafts examples/draft-vs-gold/drafts.jsonl \
            --out /tmp/score_run/
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "unexpected flowpact-score exit: $code" >&2
            exit 1
          fi
          test -f /tmp/score_run/manifest.json
          test -f /tmp/score_run/scorecard.json
          test -f /tmp/score_run/population_audit.json
          test -f /tmp/score_run/failure_cards.md
          flowpact-score diff \
            --baseline /tmp/score_run/manifest.json \
            --candidate /tmp/score_run/manifest.json
