name: Feature request
description: Suggest an improvement to Flowpact
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engagement or WCA workflow is awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Flowpact do instead?
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Out of scope?
      description: Confirm this is not SQL contracts, LLM eval, SaaS, or orchestration.
      placeholder: Not asking for warehouse checks / RAGAS / UI...
